[project]
name = "ipbuilding-debug-toolkit"
version = "0.1.0"
description = "Local debug toolkit for the IPBuilding Gateway add-on."
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0,<3",
  "aiohttp>=3.9",
  "pydantic>=2",
]

[project.scripts]
ipbuilding-debug = "ipbuilding_debug.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ipbuilding_debug*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
